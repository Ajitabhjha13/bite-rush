<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password | Bite Rush</title>
  <link rel="icon" href="images/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16.png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <meta name="theme-color" content="#14110F">
  <meta name="description" content="Choose a new password for your Bite Rush account.">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="auth-split">

    <!-- Left: Branding Panel (hidden on mobile) -->
    <div class="auth-branding d-none d-md-flex">
      <div class="auth-branding-content">
        <img src="images/logo.png" alt="Bite Rush" class="auth-branding-logo">
        <h1 class="fw-bold mt-3">Bite Rush</h1>
        <p class="text-white-50">Food delivery and table booking in Vadodara.</p>
        <ul class="auth-feature-list">
          <li><i class="bi bi-lightning-charge-fill"></i> Simple ordering</li>
          <li><i class="bi bi-list-check"></i> Order status in My Orders</li>
          <li><i class="bi bi-calendar2-check"></i> Table booking</li>
        </ul>
      </div>
    </div>

    <!-- Right: Form Panel -->
    <main id="main" class="auth-form-panel">
      <div class="auth-form-wrapper">

        <a href="index.html" class="d-inline-flex d-md-none align-items-center gap-2 mb-4 text-decoration-none">
          <img src="images/logo.png" alt="Bite Rush" class="mobile-logo">
          <span class="fw-bold fs-4" style="color:var(--color-ink);">Bite Rush</span>
        </a>

        <h3 class="fw-bold mb-1">Choose a new password</h3>
        <p class="text-muted small mb-4">Use at least 8 characters.</p>

        <div id="resetError" class="alert alert-danger d-none" role="alert"></div>
        <div id="resetDone" class="alert alert-success d-none" role="status" tabindex="-1"></div>

        <form id="resetForm" novalidate>
          <div class="mb-3">
            <label class="form-label" for="resetPassword">New password</label>
            <input type="password" class="form-control" id="resetPassword" required placeholder="At least 8 characters" autocomplete="new-password">
            <div class="invalid-feedback"></div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="resetConfirm">Confirm new password</label>
            <input type="password" class="form-control" id="resetConfirm" required placeholder="Type it again" autocomplete="new-password">
            <div class="invalid-feedback"></div>
          </div>
          <button type="submit" class="btn btn-warning w-100 fw-semibold py-2" id="resetBtn">Change password</button>
        </form>

        <p class="text-center text-muted small mt-3 mb-0" id="resetLinks">
          <a href="login.html" class="text-decoration-none fw-semibold" style="color:var(--color-gold-dark);">Back to login</a>
        </p>
      </div>
    </main>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/escape.js"></script>
  <script src="js/config.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/password-reset.js"></script>
</body>
</html>
