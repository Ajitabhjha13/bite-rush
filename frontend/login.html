<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Bite Rush</title>
  <link rel="icon" href="images/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16.png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <meta name="theme-color" content="#14110F">
  <meta name="description" content="Log in to your Bite Rush account to order food and manage table bookings.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Bite Rush">
  <meta property="og:title" content="Login | Bite Rush">
  <meta property="og:description" content="Log in to your Bite Rush account to order food and manage table bookings.">
  <meta property="og:image" content="https://bite-rush-frontend.onrender.com/images/og-image.png">
  <meta name="twitter:card" content="summary_large_image">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="auth-split">

    <!-- Left: Branding Panel (hidden on mobile) -->
    <div class="auth-branding d-none d-md-flex">
      <div class="auth-branding-content">
        <img src="images/logo.png" alt="Bite Rush" class="auth-branding-logo">
        <h1 class="fw-bold mt-3">Bite Rush</h1>
        <p class="text-white-50">Food delivery and table booking in Vadodara.</p>
        <ul class="auth-feature-list">
          <li><i class="bi bi-lightning-charge-fill"></i> Simple ordering</li>
          <li><i class="bi bi-list-check"></i> Order status in My Orders</li>
          <li><i class="bi bi-calendar2-check"></i> Table booking</li>
        </ul>
      </div>
    </div>

    <!-- Right: Form Panel -->
    <div class="auth-form-panel">
      <div class="auth-form-wrapper">

        <!-- Logo shown only on mobile, since branding panel is hidden there -->
        <a href="index.html" class="d-inline-flex d-md-none align-items-center gap-2 mb-4 text-decoration-none">
          <img src="images/logo.png" alt="Bite Rush" class="mobile-logo">
          <span class="fw-bold fs-4" style="color:var(--color-ink);">Bite Rush</span>
        </a>

        <h3 class="fw-bold mb-1">Welcome Back</h3>
        <p class="text-muted small mb-4">Your next meal is just one login away.</p>

        <div id="loginError" class="alert alert-danger d-none" role="alert"></div>

        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label class="form-label">Email address</label>
            <input type="email" class="form-control" id="loginEmail" required placeholder="you@example.com">
            <div class="invalid-feedback"></div>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" id="loginPassword" required placeholder="••••••••">
            <div class="invalid-feedback"></div>
          </div>
          <button type="submit" class="btn btn-warning w-100 fw-semibold py-2" id="loginBtn">
            Login
          </button>
          <p class="small text-muted text-center mt-3 mb-0">By logging in you agree to the <a href="terms.html" target="_blank" rel="noopener">Terms and Conditions</a> and <a href="privacy.html" target="_blank" rel="noopener">Privacy Policy</a>.</p>
        </form>

        <p class="text-center text-muted small mt-3 mb-0">
          Don't have an account? <a href="register.html" class="text-decoration-none fw-semibold" style="color:var(--color-gold-dark);">Register here</a>
        </p>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/escape.js"></script>
  <script src="js/config.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
