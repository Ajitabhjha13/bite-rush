<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Bite Rush</title>
  <link rel="icon" type="image/png" href="images/logo.png">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="auth-split">

    <!-- Left: Branding Panel (hidden on mobile) -->
    <div class="auth-branding d-none d-md-flex">
      <div class="auth-branding-content">
        <img src="images/logo.png" alt="Bite Rush" class="auth-branding-logo">
        <h1 class="fw-bold mt-3">Bite Rush</h1>
        <p class="text-white-50">Fresh food, delivered fast.</p>
        <ul class="auth-feature-list">
          <li><i class="bi bi-lightning-charge-fill"></i> Fast Ordering</li>
          <li><i class="bi bi-broadcast"></i> Live Order Tracking</li>
          <li><i class="bi bi-shield-check"></i> Secure Checkout</li>
        </ul>
      </div>
    </div>

    <!-- Right: Form Panel -->
    <div class="auth-form-panel">
      <div class="auth-form-wrapper">

        <!-- Logo shown only on mobile, since branding panel is hidden there -->
        <a href="index.html" class="d-inline-flex d-md-none align-items-center gap-2 mb-4 text-decoration-none">
          <img src="images/logo.png" alt="Bite Rush" class="mobile-logo">
          <span class="fw-bold fs-4" style="color:var(--color-ink);">Bite Rush</span>
        </a>

        <h3 class="fw-bold mb-1">Create Account</h3>
        <p class="text-muted small mb-4">Sign up and start ordering in seconds.</p>

        <div id="registerError" class="alert alert-danger d-none" role="alert"></div>

        <form id="registerForm" novalidate>
          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control" id="registerName" required placeholder="Your name">
            <div class="invalid-feedback"></div>
          </div>
          <div class="mb-3">
            <label class="form-label">Email address</label>
            <input type="email" class="form-control" id="registerEmail" required placeholder="you@example.com">
            <div class="invalid-feedback"></div>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" id="registerPassword" required placeholder="At least 6 characters" minlength="6">
            <div class="invalid-feedback"></div>
          </div>
          <button type="submit" class="btn btn-warning w-100 fw-semibold py-2" id="registerBtn">
            Register
          </button>
        </form>

        <p class="text-center text-muted small mt-3 mb-0">
          Already have an account? <a href="login.html" class="text-decoration-none fw-semibold" style="color:var(--color-gold-dark);">Login here</a>
        </p>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
